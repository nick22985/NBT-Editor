name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkStructure checkLang :core:test test --stacktrace

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.17.1", "1.18.2", "1.19.2", "1.19.3", "1.19.4", "1.20.1", "1.20.2", "1.20.4", "1.20.6", "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8", "1.21.10", "1.21.11", "26.1.2", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/rewrite' && github.ref != 'refs/heads/main' }}
      - run: ./gradlew :platform:${{ matrix.version }}:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nbtedit-${{ matrix.version }}
          path: platform/versions/${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error

  gametest:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.4", "1.21.5", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libegl1
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :platform:${{ matrix.version }}:runClientGameTest --stacktrace
        env:
          SDL_VIDEO_FORCE_EGL: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-screenshots-${{ matrix.version }}
          path: platform/versions/${{ matrix.version }}/build/run/clientGameTest/screenshots/
